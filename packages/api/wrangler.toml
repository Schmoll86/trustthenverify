name = "trustthenverify-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Custom domain routes — api.* for production, sandbox.* for sandbox mode
routes = [
  { pattern = "api.trustthenverify.com/*", zone_name = "trustthenverify.com" },
  { pattern = "sandbox.trustthenverify.com/*", zone_name = "trustthenverify.com" },
]

# Async jobs: Argus Codex refinement, oracle dispatch, timeout sweeps
[[queues.producers]]
binding = "QUEUE"
queue = "ttv-async-jobs"

[[queues.consumers]]
queue = "ttv-async-jobs"
max_batch_size = 10
max_retries = 3

# Escrow timeout sweep (Phase 1)
[triggers]
crons = ["*/5 * * * *"]

# Workers AI — Tier 2 semantic constraints (§3.1.2)
[ai]
binding = "AI"

# Secrets (set via `wrangler secret put`):
# SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, GATEWAY_PRIVATE_KEY, SANDBOX_KEYS
# STRIPE_SECRET_KEY, OPENROUTER_API_KEY
# NOSTR_RELAY_URLS — comma-separated WebSocket relay URLs (optional, e.g. "wss://relay.damus.io,wss://nos.lol")

# Rate limiting — per-agent sliding window counters
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "29c97513f8c640b889a52ce0111f5d84"

[vars]
API_VERSION = "v2"
ARBITRATION_MODEL = "google/gemini-2.5-flash"
BASE_RPC_URL = "https://base-mainnet.g.alchemy.com/v2/pSqXLT1kg-6HQ7rE7Gu9W"
BASE_CHAIN_ID = "8453"
ESCROW_FACTORY_ADDRESS = "0xE1E21350E4807adB472fbBb904Cd2Da75Eb77e1e"
USDC_ADDRESS = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
TRANSLATOR_MODEL = "google/gemini-2.5-flash"
CROSS_VALIDATOR_MODEL = "google/gemini-2.5-flash-lite"

# Secrets (set via `wrangler secret put`):
# GATEWAY_EOA_PRIVATE_KEY — secp256k1 key for on-chain gateway signatures (falls back to GATEWAY_PRIVATE_KEY)

# ─── Staging environment (Base Sepolia testnet) ─────────────────────────────
[env.staging]
name = "trustthenverify-api-staging"
routes = [
  { pattern = "staging-api.trustthenverify.com/*", zone_name = "trustthenverify.com" },
]

[env.staging.vars]
API_VERSION = "v2"
BASE_RPC_URL = "https://sepolia.base.org"
BASE_CHAIN_ID = "84532"
ESCROW_FACTORY_ADDRESS = "0xE1E21350E4807adB472fbBb904Cd2Da75Eb77e1e"
USDC_ADDRESS = "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
TRANSLATOR_MODEL = "google/gemini-2.5-flash"
CROSS_VALIDATOR_MODEL = "google/gemini-2.5-flash-lite"
